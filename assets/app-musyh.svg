<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="MusyH, app principal: música, playlists y artistas. Descargar APK">
<rect x="1" y="1" width="998" height="298" rx="16" fill="#0A0909" stroke="#FF2D3D" stroke-width="2"/>
<defs><clipPath id="hm"><path d="M20,12 H39 V40 H61 V12 H80 V88 H61 V60 H39 V88 H20 Z"/></clipPath></defs>
<g transform="translate(50,40) scale(2.2)">
  <path d="M20,12 H39 V40 H61 V12 H80 V88 H61 V60 H39 V88 H20 Z" fill="none" stroke="#FF2D3D" stroke-width="2.4" stroke-linejoin="miter" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.8s" fill="freeze" calcMode="spline" keySplines=".6 0 .2 1"/></path>
  <path d="M20,12 H39 V40 H61 V12 H80 V88 H61 V60 H39 V88 H20 Z" fill="none" stroke="#FF2D3D" stroke-width="1.2" opacity="0" transform="translate(4,-3)">
    <animate attributeName="opacity" values="0;0;.9;0;.7;0" keyTimes="0;.88;.9;.92;.94;1" dur="7s" begin="2s" repeatCount="indefinite"/>
  </path>
  <g clip-path="url(#hm)" fill="#FF2D3D">
    <rect x="20" y="40" width="60" height="20" opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".4s" begin="1.6s" fill="freeze"/></rect>
    <rect x="0" y="-10" width="100" height="6" opacity=".55"><animate attributeName="y" values="-10;100" dur="3.2s" begin="2s" repeatCount="indefinite"/></rect>
  </g>
</g>
