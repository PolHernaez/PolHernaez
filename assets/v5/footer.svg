<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="H de Hernaez. Gracias por pasar">
<path d="M250,80 H540 M660,80 H950" stroke="#FF2D3D" stroke-width="2"/>
<defs><clipPath id="hf"><path d="M20,12 H39 V40 H61 V12 H80 V88 H61 V60 H39 V88 H20 Z"/></clipPath></defs>
<g transform="translate(550,30) scale(1)">
  <path d="M20,12 H39 V40 H61 V12 H80 V88 H61 V60 H39 V88 H20 Z" fill="none" stroke="#FF2D3D" stroke-width="2.4" stroke-linejoin="miter" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.8s" fill="freeze" calcMode="spline" keySplines=".6 0 .2 1"/></path>
  <path d="M20,12 H39 V40 H61 V12 H80 V88 H61 V60 H39 V88 H20 Z" fill="none" stroke="#FF2D3D" stroke-width="1.2" opacity="0" transform="translate(4,-3)">
    <animate attributeName="opacity" values="0;0;.9;0;.7;0" keyTimes="0;.88;.9;.92;.94;1" dur="7s" begin="2s" repeatCount="indefinite"/>
