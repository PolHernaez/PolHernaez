    <rect x="20" y="40" width="60" height="20" opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".4s" begin="1.6s" fill="freeze"/></rect>
    <rect x="0" y="-10" width="100" height="6" opacity=".55"><animate attributeName="y" values="-10;100" dur="3.2s" begin="2s" repeatCount="indefinite"/></rect>
  </g>
</g>
<text x="600" y="176" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="17" letter-spacing="3" fill="#FF2D3D">H de Hernaez · gracias por pasar</text>
