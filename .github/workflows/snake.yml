name: snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#FF2D3D&color_dots=#1A1616,#4A1218,#80161F,#BF1E2B,#FF2D3D&color_background=#0A0909
            dist/snake-light.svg?color_snake=#FF2D3D&color_dots=#E4DCCF,#F5B5BA,#F07A83,#E8424F,#C4111F
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
